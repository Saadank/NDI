name: Build & Deploy to OCI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (defaults to git SHA). Use this to roll back.'
        required: false
        default: ''

concurrency:
  group: prod-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_REPO: ${{ github.repository }}        # e.g. owner/DataSharing-1st

jobs:
  # -------------------------------------------------------
  # 1. Build multi-arch (arm64 for A1.Flex) and push to GHCR
  # -------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tagging.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tagging
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/api:${{ steps.tagging.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push Worker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.worker
          target: production
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/worker:${{ steps.tagging.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/worker:latest
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  # -------------------------------------------------------
  # 2. Deploy to the OCI VM
  # -------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          GITHUB_REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: IMAGE_TAG,GITHUB_REPO
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/datasharing

            echo "==> Logging in to GHCR"
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

            echo "==> Fetching latest compose + nginx config from main"
            git fetch --all --prune
            git reset --hard origin/main

            echo "==> Pulling images: $IMAGE_TAG"
            export IMAGE_TAG GITHUB_REPO
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull api worker
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull postgres redis minio keycloak nginx

            echo "==> Running DB migrations (fails the deploy on error)"
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d postgres
            docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm api alembic upgrade head

            echo "==> Rolling services"
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans

            echo "==> Waiting for API health (direct, inside docker network)"
            for i in {1..30}; do
              if docker compose -f docker-compose.prod.yml exec -T api \
                   curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
                echo "API healthy"; break
              fi
              sleep 5
              if [ "$i" = "30" ]; then
                echo "API did not become healthy"
                docker compose -f docker-compose.prod.yml logs --tail=100 api
                exit 1
              fi
            done

            echo "==> Verifying edge reachability via nginx (HTTPS)"
            curl -kLfsS https://localhost/health >/dev/null || {
              echo "nginx edge check failed"
              docker compose -f docker-compose.prod.yml logs --tail=50 nginx
              exit 1
            }

            echo "==> Pruning old images"
            docker image prune -f

            echo "==> Deployed tag: $IMAGE_TAG"
