[project]
name = "data-management-platform"
version = "1.0.0"
description = "Multi-product SaaS portal for Saudi Arabian enterprises"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "minio>=7.2.0",
    "python-keycloak>=4.6.0",
    "pydantic>=2.10.0",
    "pydantic[email]>=2.10.0",
    "email-validator>=2.2.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "aiosmtplib>=3.0.0",
    "jinja2>=3.1.0",
    "httpx>=0.28.0",
    "tzdata>=2024.1",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
# NDMO Compliance product — document extraction + Arabic OCR + xlsx parsing.
# Install with: uv sync --extra ndmo
# Note: arabic-reshaper is intentionally NOT included; see
# app/products/ndmo_compliance/extraction/arabic_text.py for the rationale.
ndmo = [
    # Extraction layer (Phase 1)
    "pymupdf>=1.25.5",
    "python-bidi>=0.6.6",
    "opencv-python-headless>=4.11",
    "pdf2image>=1.17.0",
    "openpyxl>=3.1.0",
    "paddleocr>=3.0.0",
    "paddlepaddle>=3.0.0",
    # Phase 2: ingestion pipeline (ClamAV + Restate + Qdrant + BGE-M3)
    "clamd>=1.0.2",
    "restate-sdk>=0.4.0",
    "qdrant-client>=1.12.0",
    "fastembed>=0.4.0",          # BGE-M3 dense + BM25 sparse via fastembed
    # Phase 3: assessment engine (OpenAI GPT-4o + structured outputs)
    # OPENAI_BASE_URL env var overrides the endpoint (Azure / proxy / etc.).
    "openai>=1.40.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
