<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Accept Invitation — Data Sharing Platform</title>
  <style>
    :root {
      --bg:#f3f4f6; --card:#fff; --border:#e5e7eb; --ink:#0f172a;
      --muted:#6b7280; --brand:#1a2a4a; --brand-hover:#0a1628;
      --danger:#dc2626; --success:#059669;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding:40px 24px;min-height:100vh}
    .wrap{max-width:440px;margin:0 auto}
    .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:32px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
    h1{margin:0 0 4px;font-size:20px;letter-spacing:-.02em}
    .muted{color:var(--muted);font-size:13px;margin-bottom:22px}
    label{display:block;font-size:11px;font-weight:600;color:#334155;margin:12px 0 4px;text-transform:uppercase;letter-spacing:.04em}
    input{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:inherit}
    input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 2px rgba(26,42,74,.12)}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .btn{display:block;width:100%;margin-top:18px;background:var(--brand);color:#fff;padding:11px 18px;border-radius:6px;font-weight:600;border:0;cursor:pointer;font-size:14px;font-family:inherit}
    .btn:hover{background:var(--brand-hover)}
    .btn[disabled]{background:#94a3b8;cursor:not-allowed}
    .banner{padding:12px 14px;border-radius:6px;font-size:13px;margin-bottom:18px;display:none}
    .banner.err{background:#fef2f2;color:var(--danger);border:1px solid #fecaca;display:block}
    .banner.ok{background:#ecfdf5;color:var(--success);border:1px solid #a7f3d0;display:block}
    .hint{font-size:11px;color:var(--muted);margin-top:4px}
    a{color:var(--brand)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Accept your invitation</h1>
      <div class="muted">Set your name and password to activate your account.</div>
      <div id="banner" class="banner"></div>
      <form id="form" onsubmit="return submitForm(event)">
        <div class="row">
          <div><label>First name</label><input id="fn" required></div>
          <div><label>Last name</label><input id="ln" required></div>
        </div>
        <label>Password</label>
        <input id="pw" type="password" minlength="8" required>
        <div class="hint">At least 8 characters.</div>
        <label>Confirm password</label>
        <input id="pw2" type="password" minlength="8" required>
        <button class="btn" id="submit">Create account</button>
      </form>
      <div id="done" style="display:none">
        <div class="muted" style="margin-top:8px">Account created. You can now sign in.</div>
        <a class="btn" style="text-align:center;text-decoration:none;display:block" href="/">Go to sign in</a>
      </div>
    </div>
  </div>

<script>
const API_BASE = window.location.origin;
const params = new URLSearchParams(window.location.search);
const token = params.get('token');

function showBanner(msg, kind) {
  const b = document.getElementById('banner');
  b.textContent = msg;
  b.className = 'banner ' + kind;
}

if (!token) {
  showBanner('Missing invitation token. Please use the link from your email.', 'err');
  document.getElementById('submit').disabled = true;
}

async function submitForm(e) {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  const pw2 = document.getElementById('pw2').value;
  if (pw !== pw2) { showBanner('Passwords do not match.', 'err'); return false; }

  const btn = document.getElementById('submit');
  btn.disabled = true; btn.textContent = 'Creating…';
  try {
    const r = await fetch(`${API_BASE}/api/v1/platform/invitations/accept`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        token,
        first_name: document.getElementById('fn').value,
        last_name: document.getElementById('ln').value,
        password: pw,
      }),
    });
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      const msg = Array.isArray(e.detail)
        ? e.detail.map(d => `${d.loc?.slice(-1)[0] || 'field'}: ${d.msg}`).join('; ')
        : (e.detail || r.statusText);
      throw new Error(msg);
    }
    document.getElementById('form').style.display = 'none';
    document.getElementById('done').style.display = 'block';
    showBanner('Welcome! Your account has been created.', 'ok');
  } catch (err) {
    showBanner(err.message, 'err');
    btn.disabled = false; btn.textContent = 'Create account';
  }
  return false;
}
</script>
</body>
</html>
