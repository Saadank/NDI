# nginx.conf — corrected full TLS config
#
# Fixes vs. original:
#   - Cert filenames now fullchain.pem / privkey.pem (what certbot actually writes)
#   - Separate server blocks per subdomain (app/api/auth) with explicit server_name
#   - Keycloak upstream added (auth.<domain> -> keycloak:8080)
#   - Static frontend served at / with SPA-ish fallback to index.html
#   - /.well-known/acme-challenge reserved for webroot renewals (no nginx stop required)
#   - Rate limits preserved, plus connection limits added
#   - Security headers hardened (CSP, Referrer-Policy, Permissions-Policy)
#   - gzip enabled for static assets
#   - Logs to stdout/stderr (Docker captures them)
#
# DOMAIN variable: set via `envsubst` at deploy time or hard-code.
# For portability, nginx doesn't expand env vars inline. Pick one:
#   A) Hard-code your domain in the three `server_name` lines below
#   B) Use the `issue-certs.sh` + `render-nginx.sh` helpers in scripts/
#   (simplest is A — change it once here when your domain is final.)

events {
    worker_connections 2048;
}

http {
    # ------- Logging (stdout/stderr for Docker) -------
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # ------- Basic hygiene -------
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ------- gzip -------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ------- Rate limit zones -------
    limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # ------- Upstreams -------
    upstream api {
        server api:8000;
        keepalive 32;
    }

    upstream keycloak {
        server keycloak:8080;
        keepalive 32;
    }

    # ------- Shared SSL settings -------
    # Include once, reference in each TLS server block.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # ------- Security headers (applied in each server via include/add_header) -------
    map $sent_http_content_type $frame_opts {
        default "DENY";
    }

    # ===========================================================
    # Port 80 -- ACME challenges + redirect everything else to HTTPS
    # ===========================================================
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ===========================================================
    # app — static frontend (index.html + pickup.html)
    # ===========================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name datasharing.sa www.datasharing.sa;   # <-- change to your domain

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.datasharing.sa https://auth.datasharing.sa; frame-ancestors 'none';" always;

        limit_conn conn_per_ip 50;
        client_max_body_size 5g;

        root /usr/share/nginx/html;
        index index.html;

        # Static assets with long cache
        location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|woff2?)$ {
            expires 7d;
            access_log off;
            try_files $uri =404;
        }

        # Pickup page
        location = /pickup {
            try_files /pickup.html =404;
        }

        # SPA-ish fallback to index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ===========================================================
    # api — FastAPI backend
    # ===========================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name api.datasharing.sa;                   # <-- change to your domain

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        limit_conn conn_per_ip 100;
        client_max_body_size 5g;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;

        location = /health {
            proxy_pass http://api/health;
            access_log off;
        }

        location /api/v1/platform/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location / {
            return 404;
        }
    }

    # ===========================================================
    # auth — Keycloak
    # ===========================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name auth.datasharing.sa;                  # <-- change to your domain

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Keycloak sets its own X-Frame-Options; don't force DENY here (admin console uses iframes)

        limit_conn conn_per_ip 50;
        client_max_body_size 100m;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;

        # Hide Keycloak management/health from the public internet
        location /health {
            deny all;
            return 404;
        }
        location /metrics {
            deny all;
            return 404;
        }

        location / {
            proxy_pass http://keycloak;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header Connection "";
            proxy_buffer_size   128k;
            proxy_buffers       4 256k;
            proxy_busy_buffers_size 256k;
        }
    }
}
