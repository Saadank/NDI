# nginx-bootstrap.conf
# HTTP-only config used for the very first certbot --webroot issuance.
# After certs are in place, restore the full TLS config and reload.
#
# Typical usage (one-time, first deploy):
#   # 1) stash the TLS config
#   cp nginx/nginx.conf nginx/nginx.conf.tls.bak
#   # 2) become bootstrap
#   cp nginx/nginx-bootstrap.conf nginx/nginx.conf
#   docker compose -f docker-compose.prod.yml up -d nginx postgres
#   # 3) issue certs
#   DOMAIN_ROOT=your.tld ADMIN_EMAIL=you@your.tld ./scripts/issue-certs.sh
#   # 4) restore TLS config
#   cp nginx/nginx.conf.tls.bak nginx/nginx.conf
#   docker compose -f docker-compose.prod.yml exec nginx nginx -s reload

events {
    worker_connections 1024;
}

http {
    server {
        listen 80 default_server;
        server_name _;

        # Serve ACME challenge files from the shared webroot volume
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        # Everything else returns a simple holding page
        location / {
            return 200 "DataSharing bootstrap. TLS pending.\n";
            add_header Content-Type text/plain;
        }
    }
}
